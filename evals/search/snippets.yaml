  language: python
  tags: [asyncio]
  code: |
    async def fetch_all(urls: list[str], limit: int = 5):
        sem = asyncio.Semaphore(limit)
        async def one(url: str):
            async with sem:
                return await client.get(url)
        return await asyncio.gather(*(one(u) for u in urls))

