- id: js-debounce
  title: Debounce helper
  description: Wait until calls stop for `ms` before running
  language: javascript
  tags: [timing]
  code: |
    export function debounce(fn, ms = 300) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

- id: js-throttle
  title: throttle
  language: javascript
  code: |
    export function throttle(fn, limit) {
      let waiting = false;
      return (...args) => {
        if (waiting) return;
        fn(...args);
        waiting = true;
        setTimeout(() => (waiting = false), limit);
      };
    }

- id: ts-use-debounced-value
  title: useDebouncedValue
  description: React hook for search inputs
  language: typescript
  tags: [react, hooks]
  code: |
    export function useDebouncedValue<T>(value: T, delay = 300): T {
      const [debounced, setDebounced] = useState(value);
      useEffect(() => {
        const id = setTimeout(() => setDebounced(value), delay);
        return () => clearTimeout(id);
      }, [value, delay]);
      return debounced;
    }

