# Local development stack: `docker compose up -d --build`
#   API                  http://localhost:8000   (docs at /docs, health at /health)
#   Postgres + pgvector  localhost:5434  (user/password/db: devflow)
#   Redis                localhost:6380
# Host ports avoid 5432 (a native Postgres), and ReviewPilot's 5433 / 6379, so both
# stacks can run at once. Containers still reach each other on the default ports.
#   worker               Taskiq worker: embeds snippets (logs: docker compose logs -f worker)
#   scheduler            Taskiq scheduler: periodic jobs (exactly one!)
# Only the databases? `docker compose up -d postgres redis` and run uvicorn yourself.
# The worker doesn't hot-reload: after changing job code, `docker compose restart worker`.

x-backend: &backend
  build: ./backend
  image: devflow-backend
  # Secrets (JWT_SECRET) come from backend/.env; the values below override its localhost
  # settings so containers reach the other services by name and use the baked-in model.
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://devflow:devflow@postgres:5432/devflow
    DATABASE_DIRECT_URL: ""
    REDIS_URL: redis://redis:6379/0
    FASTEMBED_CACHE_PATH: /app/models
  volumes:
    - ./backend/app:/app/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    # Postgres 16 with the pgvector extension preinstalled (needed from Phase 4).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    # Apply migrations, then serve with auto-reload on source changes.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    # One process: each would load its own copy of the model. It runs many jobs
    # concurrently anyway (they're async; inference runs in a thread).
    command: taskiq worker app.workers.broker:broker app.workers.tasks --workers 1
    depends_on:
      api:
        condition: service_healthy  # the API has applied the migrations

  scheduler:
    <<: *backend
    command: taskiq scheduler app.workers.broker:scheduler app.workers.tasks
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
