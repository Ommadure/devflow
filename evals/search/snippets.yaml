- id: js-relative-time
  title: timeAgo
  language: javascript
  tags: [intl, dates]
  code: |
    const rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
    export function timeAgo(date) {
      const minutes = Math.round((date - Date.now()) / 60000);
      if (Math.abs(minutes) < 60) return rtf.format(minutes, "minute");
      const hours = Math.round(minutes / 60);
      if (Math.abs(hours) < 24) return rtf.format(hours, "hour");
      return rtf.format(Math.round(hours / 24), "day");
    }

- id: ts-event-emitter
  title: Typed event emitter
  language: typescript
  code: |
    type Handler<T> = (payload: T) => void;
    export class Emitter<Events extends Record<string, unknown>> {
      private handlers: { [K in keyof Events]?: Handler<Events[K]>[] } = {};
      on<K extends keyof Events>(event: K, handler: Handler<Events[K]>) {
        (this.handlers[event] ??= []).push(handler);
        return () => this.off(event, handler);
      }
      off<K extends keyof Events>(event: K, handler: Handler<Events[K]>) {
        this.handlers[event] = this.handlers[event]?.filter((h) => h !== handler);
      }
      emit<K extends keyof Events>(event: K, payload: Events[K]) {
        this.handlers[event]?.forEach((h) => h(payload));
      }
    }

