[project]
name = "devflow-api"
version = "0.1.0"
description = "DevFlow API: FastAPI backend for the DevFlow developer dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "redis>=5.2",
    "sentry-sdk>=2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    # <0.13: taskiq 0.13.0 (2026-09-26) removed taskiq.compat.model_dump, which
    # taskiq-redis 1.2.3 still imports. Lift once taskiq-redis supports 0.13.
    "taskiq>=0.12.1,<0.13",
    "taskiq-redis>=1.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "respx>=0.22",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # asserts and fake secrets are normal in tests
"scripts/seed_demo.py" = ["E501"] # demo data: each code sample stays on one line

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs code inside greenlets; without this, coverage
# misses lines executed after DB awaits and under-reports async routes.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
