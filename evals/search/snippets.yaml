- id: py-retry-decorator
  title: retry decorator
  language: python
  code: |
    def retry(times: int = 3, base: float = 0.5):
        def wrap(fn):
            @functools.wraps(fn)
            def inner(*args, **kwargs):
                for attempt in range(times):
                    try:
                        return fn(*args, **kwargs)
                    except Exception:
                        if attempt == times - 1:
                            raise
                        time.sleep(base * 2**attempt)
            return inner
        return wrap

