# Local development stack: `docker compose up -d --build`
#   API                  http://localhost:8000   (docs at /docs, health at /health)
#   Postgres + pgvector  localhost:5434  (user/password/db: devflow)
#   Redis                localhost:6380
# Host ports avoid 5432 (a native Postgres), and ReviewPilot's 5433 / 6379, so both
# stacks can run at once. Containers still reach each other on the default ports.
# Only the databases? `docker compose up -d postgres redis` and run uvicorn yourself.
# The Taskiq worker and scheduler join in Phase 4.

services:
  postgres:
    # Postgres 16 with the pgvector extension preinstalled (needed from Phase 4).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    # Secrets (JWT_SECRET) come from backend/.env; the URLs below override its localhost
    # values so the container reaches the other services by name.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://devflow:devflow@postgres:5432/devflow
      DATABASE_DIRECT_URL: ""
      REDIS_URL: redis://redis:6379/0
    # Apply migrations, then serve with auto-reload on source changes.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
